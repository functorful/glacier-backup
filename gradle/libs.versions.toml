[versions]
micronaut = "4.6.3"
picocli = "4.7.7"
awssdk = "2.57.8"
assertj = "3.27.7"
junit = "5.11.3"
testcontainers = "1.21.4"
snakeyaml = "2.7"
slf4j = "2.0.20"

[libraries]
micronaut-platform = { module = "io.micronaut.platform:micronaut-platform", version.ref = "micronaut" }
micronaut-picocli = { module = "io.micronaut.picocli:micronaut-picocli" }
picocli = { module = "info.picocli:picocli", version.ref = "picocli" }
picocli-codegen = { module = "info.picocli:picocli-codegen", version.ref = "picocli" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
slf4j-nop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j" }
awssdk-s3 = { module = "software.amazon.awssdk:s3", version.ref = "awssdk" }
awssdk-s3transfermanager = { module = "software.amazon.awssdk:s3-transfer-manager", version.ref = "awssdk" }
awssdk-netty-nio-client = { module = "software.amazon.awssdk:netty-nio-client", version.ref = "awssdk" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
testcontainers-localstack = { module = "org.testcontainers:localstack", version.ref = "testcontainers" }
testcontainers-junit-jupiter = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }

[plugins]
graalvm = { id = "org.graalvm.buildtools.native", version = "0.10.3" }
